<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<style>
:root{--bg:#fbfbf9;--fg:#1e1e1c;--muted:#6b6b66;--rule:#e4e2dc;--accent:#2b5e9e;--mark:#fff1a8;--note:#fffbe6}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
a{color:var(--accent);text-decoration:none}a:hover{text-decoration:underline}
#layout{display:grid;grid-template-columns:200px minmax(0,1fr) 240px;gap:24px;max-width:2000px;margin:0 auto;padding:16px 20px}
#toc{position:sticky;top:16px;align-self:start;max-height:calc(100vh - 32px);overflow:auto;font-size:13px;color:var(--muted);padding-right:8px}
#toc ul{list-style:none;padding-left:0;margin:4px 0}#toc ul ul{padding-left:12px}#toc li{margin:3px 0}#toc a{color:var(--muted)}#toc a.active{color:var(--fg);font-weight:600}
#toc .meta{border-bottom:1px solid var(--rule);padding-bottom:8px;margin-bottom:8px}
#status{font-size:12px;color:var(--muted);margin-top:10px;border-top:1px solid var(--rule);padding-top:8px}
#status b{color:var(--fg)}
article h1{font-size:28px;line-height:1.2;margin:8px 0 4px}article h2{font-size:21px;margin:40px 0 10px;padding-top:8px;border-top:1px solid var(--rule)}article h3{font-size:17px;margin:28px 0 6px}article h4{font-size:15px;margin:20px 0 4px;color:var(--muted)}
article p,article li{max-width:80ch}
article table{border-collapse:collapse;font-size:12.5px;margin:12px 0;display:block;overflow-x:auto;max-width:100%;width:max-content}
article th,article td{border:1px solid var(--rule);padding:4px 7px;text-align:left;vertical-align:top;max-width:520px;overflow-wrap:anywhere}article th{background:#f1f0eb}
article blockquote{margin:12px 0;padding:8px 14px;border-left:3px solid #cfcdc4;background:#f4f3ef;font-size:14.5px;color:#333}
article blockquote p{margin:6px 0}
article code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:#f1f0eb;padding:1px 4px;border-radius:3px}article pre{background:#f1f0eb;padding:10px;overflow:auto;border-radius:4px}article pre code{background:none;padding:0}
article details{margin:10px 0;border:1px solid var(--rule);border-radius:4px;padding:6px 10px}article summary{cursor:pointer;font-weight:600}
mark.q{background:var(--mark);padding:0 1px;border-radius:2px;cursor:pointer}
mark.q.focus{background:#ffd75e}
[data-cid].has-comment{box-shadow:inset 3px 0 0 #e0c24a}
/* margin notes */
#notes{position:relative}
.note{position:absolute;left:0;width:240px;background:var(--note);border:1px solid #ecdc9a;border-radius:5px;padding:7px 9px;font-size:13px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.05);transition:top .15s}
.note .quote{color:var(--muted);font-style:italic;font-size:12px;margin-bottom:3px;white-space:pre-wrap}
.note .text{white-space:pre-wrap}
.note .x{position:absolute;top:4px;right:7px;color:var(--muted);font-size:14px;line-height:1;cursor:pointer;opacity:.5}.note .x:hover{opacity:1;color:#b5443a}
.note.focus{border-color:#d4b53a;box-shadow:0 2px 8px rgba(0,0,0,.12)}
/* composer */
#composer{position:absolute;z-index:60;display:none;width:340px;background:#fff;border:1px solid #cfcdc4;border-radius:6px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:9px;font-size:13px}
#composer .quote{color:var(--muted);font-style:italic;font-size:12px;max-height:64px;overflow:auto;margin-bottom:6px;white-space:pre-wrap}
#composer textarea{width:100%;min-height:70px;font:inherit;padding:6px;border:1px solid var(--rule);border-radius:4px;resize:vertical}
#composer .hint{color:var(--muted);font-size:11.5px;margin-top:4px}
kbd{font:11px ui-monospace,Menlo,monospace;background:#f1f0eb;border:1px solid #d8d6cf;border-bottom-width:2px;border-radius:3px;padding:0 4px}
@media (max-width:1180px){#layout{grid-template-columns:minmax(0,1fr)}#toc,#notes{display:none}}
@media print{#toc,#notes,#composer{display:none!important}#layout{display:block}}
</style>
</head>
<body>
<div id="layout">
  <nav id="toc">
    <div class="meta"><strong>{{TITLE}}</strong><br>{{WORDS}} words, about {{MINUTES}} min</div>
    {{TOC}}
    <div id="status">Select text, press <kbd>⌘</kbd><kbd>⌥</kbd><kbd>M</kbd> to comment, <kbd>⌘</kbd><kbd>↩</kbd> to save. Click a note to edit.<br><span id="saved"></span><br><a href="#" id="clearall" style="color:#999">clear all comments on this report</a></div>
  </nav>
  <article id="report">{{BODY}}</article>
  <aside id="notes"></aside>
</div>
<div id="composer"><div class="quote" id="cq"></div><textarea id="ctext" placeholder="Comment"></textarea><div class="hint"><kbd>⌘</kbd><kbd>↩</kbd> save · <kbd>esc</kbd> cancel</div></div>
<script>
(function(){
const VERSION="{{VERSION}}", DOC=(location.pathname.split("/").pop()||"report").replace(/\.html$/,""), KEY="dtcues-comments-"+DOC+"-"+VERSION;
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const article=$("#report"), notesEl=$("#notes"), comp=$("#composer"), ctext=$("#ctext"), cq=$("#cq"), savedEl=$("#saved");
let comments=[], editing=null, pending=null, lastBlock=null, online=false, saveTimer=null;
const uid=()=>Math.random().toString(36).slice(2,9);
const api=location.protocol.startsWith("http")?"/api/comments?doc="+encodeURIComponent(DOC):null;
// ---- load
async function load(){let local=[];try{local=JSON.parse(localStorage.getItem(KEY)||"[]")}catch(e){}
  if(api){try{const r=await fetch(api,{cache:"no-store"});if(r.ok){const j=await r.json();online=true;
      // the server file is authoritative; comments are kept across rebuilds and re-anchored by their quoted text
      comments=(j.comments||[]);}}catch(e){}}
  if(!online)comments=local;
  try{render();}catch(e){setStatus("Display error: "+e);return;}
  setStatus(online?"Saved automatically to results/comments/comments_"+DOC+".md ("+comments.length+" loaded)":"Not connected to the local server: saving in this browser only. Run: uv run python -m dtcues.serve_report and open http://127.0.0.1:8791/"+DOC+".html");}
function setStatus(t){savedEl.innerHTML=t;}
function persist(){localStorage.setItem(KEY,JSON.stringify(comments));
  if(api){clearTimeout(saveTimer);saveTimer=setTimeout(async()=>{try{const r=await fetch(api,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({report:document.title,version:VERSION,comments})});online=r.ok;setStatus(r.ok?"<b>Saved</b> "+new Date().toLocaleTimeString()+" to results/comments/comments_"+DOC+".md ("+comments.length+" comments)":"Save failed: server not reachable (kept in browser)");}catch(e){online=false;setStatus("Save failed: server not reachable (kept in browser)");}},150);}
  try{render();}catch(e){setStatus("Saved, but display error: "+e);}}
// ---- anchoring
function blockOf(node){while(node&&node.nodeType!==1)node=node.parentNode;while(node&&node!==article&&!node.hasAttribute("data-cid"))node=node.parentElement;return node&&node!==article?node:null;}
article.addEventListener("mousedown",e=>{lastBlock=blockOf(e.target);});
function findQuote(root,q){const walker=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);let node;const acc=[];let total="";while((node=walker.nextNode())){acc.push([node,total.length]);total+=node.nodeValue;}
  const i=total.indexOf(q);if(i<0)return null;const r=document.createRange();let s=null,e=null;for(const [n,off] of acc){if(s===null&&i<off+n.nodeValue.length){s=[n,i-off];}if(i+q.length<=off+n.nodeValue.length){e=[n,i+q.length-off];break;}}if(!s||!e)return null;r.setStart(s[0],s[1]);r.setEnd(e[0],e[1]);return r;}
function highlightAll(){$$("mark.q").forEach(m=>{const p=m.parentNode;while(m.firstChild)p.insertBefore(m.firstChild,m);p.removeChild(m);p.normalize();});$$("[data-cid].has-comment").forEach(b=>b.classList.remove("has-comment"));
  comments.forEach(c=>{let b=c.blockId?document.querySelector('[data-cid="'+c.blockId+'"]'):null;let r=null;if(c.quote){r=(b&&findQuote(b,c.quote))||findQuote(article,c.quote);if(r&&!b){b=blockOf(r.startContainer);c.blockId=b?b.getAttribute("data-cid"):null;}}
    c._orphan=!!(c.quote&&!r);if(b)b.classList.add("has-comment");if(r){const m=document.createElement("mark");m.className="q";m.dataset.id=c.id;try{r.surroundContents(m);}catch(err){/* selection crossed elements: wrap each text node separately */const walker=document.createTreeWalker(r.commonAncestorContainer,NodeFilter.SHOW_TEXT);let n;const nodes=[];while((n=walker.nextNode())){if(r.intersectsNode(n))nodes.push(n);}nodes.forEach(n=>{const rr=document.createRange();rr.selectNodeContents(n);if(n===r.startContainer)rr.setStart(n,r.startOffset);if(n===r.endContainer)rr.setEnd(n,r.endOffset);if(rr.toString().trim()){const mm=document.createElement("mark");mm.className="q";mm.dataset.id=c.id;try{rr.surroundContents(mm);}catch(e2){}}});}}});}
function render(){highlightAll();notesEl.innerHTML="";const placed=[];const artTop=article.getBoundingClientRect().top+window.scrollY;
  const ordered=comments.map(c=>{const m=document.querySelector('mark.q[data-id="'+c.id+'"]');const b=c.blockId?document.querySelector('[data-cid="'+c.blockId+'"]'):null;const el=m||b;const top=el?el.getBoundingClientRect().top+window.scrollY-artTop:0;return {c,top};}).sort((a,b)=>a.top-b.top);
  let y=0;ordered.forEach(({c,top})=>{const d=document.createElement("div");d.className="note";d.dataset.id=c.id;d.innerHTML=(c.quote?'<div class="quote">“'+esc(c.quote.length>140?c.quote.slice(0,140)+"…":c.quote)+'”'+(c._orphan?' <span style="color:#b5443a">(quoted text no longer found; page was rebuilt)</span>':'')+'</div>':'')+'<div class="text">'+esc(c.text||"")+'</div><span class="x" title="delete">×</span>';
    d.style.top=Math.max(top,y)+"px";notesEl.appendChild(d);y=Math.max(top,y)+d.offsetHeight+8;
    d.addEventListener("click",e=>{if(e.target.classList.contains("x")){comments=comments.filter(x=>x.id!==c.id);persist();return;}focus(c.id);openComposer(c);});
    d.addEventListener("mouseenter",()=>focus(c.id));d.addEventListener("mouseleave",()=>focus(null));});
  notesEl.style.height=(y+40)+"px";}
function focus(id){$$("mark.q").forEach(m=>m.classList.toggle("focus",m.dataset.id===id));$$(".note").forEach(n=>n.classList.toggle("focus",n.dataset.id===id));}
article.addEventListener("click",e=>{const m=e.target.closest("mark.q");if(m){const c=comments.find(x=>x.id===m.dataset.id);if(c){const n=document.querySelector('.note[data-id="'+c.id+'"]');if(n)n.scrollIntoView({block:"center"});openComposer(c);}}});
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));}
// ---- composer
function openComposer(existing,quote,block,rect){editing=existing||null;pending=existing?null:{quote,block};const q=existing?existing.quote:quote;cq.textContent=q?"“"+(q.length>300?q.slice(0,300)+"…":q)+"”":"(whole paragraph)";ctext.value=existing?existing.text:"";
  let r=rect;if(!r){const m=existing?document.querySelector('mark.q[data-id="'+existing.id+'"]'):null;const el=m||(existing&&existing.blockId?document.querySelector('[data-cid="'+existing.blockId+'"]'):block);r=el?el.getBoundingClientRect():{left:200,bottom:200};}
  comp.style.display="block";comp.style.left=Math.max(12,Math.min(window.scrollX+r.left,window.scrollX+window.innerWidth-370))+"px";comp.style.top=(window.scrollY+r.bottom+8)+"px";ctext.focus();}
function closeComposer(){comp.style.display="none";editing=null;pending=null;}
function saveComposer(){const text=ctext.value.trim();if(editing){if(!text){comments=comments.filter(x=>x.id!==editing.id);}else{editing.text=text;editing.ts=new Date().toISOString();}}else if(pending&&text){const b=pending.block;comments.push({id:uid(),blockId:b?b.getAttribute("data-cid"):null,section:b?b.getAttribute("data-section"):"",quote:pending.quote||"",text,ts:new Date().toISOString(),version:VERSION});}closeComposer();persist();}
ctext.addEventListener("keydown",e=>{if((e.metaKey||e.ctrlKey)&&e.key==="Enter"){e.preventDefault();saveComposer();}else if(e.key==="Escape"){closeComposer();}});
document.addEventListener("keydown",e=>{const isM=(e.code==="KeyM"||e.key.toLowerCase()==="m"||e.key==="µ");if((e.metaKey||e.ctrlKey)&&e.altKey&&isM){e.preventDefault();startComment();}});
function startComment(){if(comp.style.display==="block")return;const s=window.getSelection();let quote="",block=null,rect=null;
  if(s&&!s.isCollapsed&&s.toString().trim()&&article.contains(s.getRangeAt(0).commonAncestorContainer)){const r=s.getRangeAt(0);quote=s.toString().trim();block=blockOf(r.startContainer)||blockOf(r.endContainer);rect=r.getBoundingClientRect();}
  else if(lastBlock){block=lastBlock;rect=block.getBoundingClientRect();}else return;
  openComposer(null,quote,block,rect);}
// ---- toc active state, relayout
const heads=$$("article h2, article h3");const links=$$("#toc a");
function onScroll(){let cur=null;for(const h of heads){if(h.getBoundingClientRect().top<120)cur=h;else break;}links.forEach(a=>a.classList.toggle("active",cur&&a.getAttribute("href")==="#"+cur.id));}
document.addEventListener("scroll",onScroll,{passive:true});window.addEventListener("resize",()=>render());$$("article details").forEach(d=>d.addEventListener("toggle",()=>render()));
window.addEventListener("error",e=>{setStatus("Script error: "+(e.message||e));});
$("#clearall").addEventListener("click",e=>{e.preventDefault();if(comments.length&&!confirm("Delete all "+comments.length+" comments on this report?"))return;comments=[];persist();});
load();onScroll();
})();
</script>
</body>
</html>
